name: Build RoutineAlarm APK

on:
  push:
    branches:
      - main
      - r52/isolated-main-fgs-fallback-20261121
      - r52/forge-avd-provisioning-fix-20261127
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Android SDK 35 installieren
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/r52/forge-avd-provisioning-fix-20261127' }}

      - name: JVM Unit Tests ausführen
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android 35 Emulator starten
        run: |
          sdkmanager "system-images;android-35;google_apis;x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd -n r52-api35 -k "system-images;android-35;google_apis;x86_64" --device "pixel_2" --force
          echo "=== AVDs after creation ==="
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/r52-api35.avd/config.ini"
          test -f "$ANDROID_USER_HOME/avd/r52-api35.ini"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "=== emulator -list-avds ==="
          emulator -list-avds
          grep -qx "r52-api35" <(emulator -list-avds)
          echo "=== enable KVM device permissions ==="
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
          echo "=== host architecture and KVM acceleration ==="
          uname -m
          emulator -accel-check 2>&1 | tee /tmp/r52-accel-check.log
          grep -qi "KVM" /tmp/r52-accel-check.log
          adb start-server
          nohup emulator -avd r52-api35 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect >/tmp/r52-emulator.log 2>&1 &
          if ! python3 - <<'PY'
          import subprocess
          import sys
          import time
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              result = subprocess.run(["adb", "devices"], capture_output=True, text=True)
              for line in result.stdout.splitlines()[1:]:
                  fields = line.split()
                  if len(fields) >= 2 and fields[1] == "device":
                      sys.exit(0)
              time.sleep(2)
          print("Android 35 emulator did not reach adb device state within 180s")
          sys.exit(1)
          PY
          then
            echo "Android 35 emulator did not become online in ADB within 180s"
            echo "=== adb devices -l ==="
            adb devices -l || true
            echo "=== emulator process ==="
            ps -axo pid,command | grep '[e]mulator' || true
            echo "=== emulator log tail ==="
            tail -n 200 /tmp/r52-emulator.log || true
            exit 1
          fi
          if ! python3 - <<'PY'
          import subprocess
          import sys
          import time
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              result = subprocess.run(["adb", "shell", "getprop", "sys.boot_completed"], capture_output=True, text=True)
              if result.returncode == 0 and result.stdout.strip() == "1":
                  sys.exit(0)
              time.sleep(2)
          print("Android 35 emulator did not reach sys.boot_completed=1 within 300s")
          sys.exit(1)
          PY
          then
            echo "=== adb devices -l ==="
            adb devices -l || true
            echo "=== sys.boot_completed ==="
            adb shell getprop sys.boot_completed || true
            echo "=== dev.bootcomplete ==="
            adb shell getprop dev.bootcomplete || true
            echo "=== emulator log tail ==="
            tail -n 200 /tmp/r52-emulator.log || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82

      - name: Android Runtime Fallback-Test vorbereiten
        run: |
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell appops set com.cztr.routinealarm SCHEDULE_EXACT_ALARM deny
          adb shell pm grant com.cztr.routinealarm android.permission.POST_NOTIFICATIONS

      - name: Android Runtime Fallback-Test ausführen
        run: |
          set -o pipefail
          adb shell am instrument -w -r -e class com.cztr.routinealarm.AlarmReceiverInstrumentedTest com.cztr.routinealarm.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/r52-instrumentation.log
          if grep -q 'FAILURES!!!\|INSTRUMENTATION_CODE: -1' /tmp/r52-instrumentation.log; then
            echo "Android instrumentation reported a failing test"
            exit 1
          fi
          grep -q 'INSTRUMENTATION_CODE: 0' /tmp/r52-instrumentation.log
          grep -q 'OK (' /tmp/r52-instrumentation.log

      - name: Signaturschlüssel wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ROUTINEALARM_KEYSTORE_BASE64 }}
        run: |
          python3 -c 'import base64, os, pathlib; encoded="".join(os.environ["KEYSTORE_BASE64"].split()); pathlib.Path(os.environ["RUNNER_TEMP"] + "/routinealarm-release.jks").write_bytes(base64.b64decode(encoded, validate=True))'
          test -s "$RUNNER_TEMP/routinealarm-release.jks"

      - name: Signaturschlüssel überprüfen
        env:
          STORE_PASSWORD: ${{ secrets.ROUTINEALARM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROUTINEALARM_KEY_ALIAS }}
        run: |
          keytool -list \\
            -keystore "$RUNNER_TEMP/routinealarm-release.jks" \\
            -storepass "$STORE_PASSWORD" \\
            -alias "$KEY_ALIAS" >/dev/null

      - name: Signierte Release APK bauen
        env:
          ROUTINEALARM_KEYSTORE_PATH: ${{ runner.temp }}/routinealarm-release.jks
          ROUTINEALARM_STORE_PASSWORD: ${{ secrets.ROUTINEALARM_STORE_PASSWORD }}
          ROUTINEALARM_KEY_ALIAS: ${{ secrets.ROUTINEALARM_KEY_ALIAS }}
          ROUTINEALARM_KEY_PASSWORD: ${{ secrets.ROUTINEALARM_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: SHA256 Prüfsumme erzeugen
        run: |
          shasum -a 256 app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/RoutineAlarm-release.sha256

      - name: Signierte APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RoutineAlarm-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/RoutineAlarm-release.sha256
          if-no-files-found: error
